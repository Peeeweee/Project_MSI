<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=10.0, user-scalable=yes, viewport-fit=cover"
    />
    <meta name="theme-color" content="#240505" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=5" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico?v=5" sizes="any" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=5" />
    <title>Original Poster (5560×3563 HD) — Project MSI</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100dvh;
        background: #1b0303;
        color: #fff1ee;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 14px;
        background: rgba(36, 5, 5, 0.92);
        border-bottom: 1px solid rgba(255, 217, 208, 0.18);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        text-decoration: none;
        color: #fff1ee;
      }
      .brand img {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        border: 1px solid rgba(255, 217, 208, 0.35);
      }
      .brand-title {
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.06em;
      }
      .brand-sub {
        font-size: 11px;
        color: rgba(255, 217, 208, 0.72);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 7px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 13px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
        border: 1px solid rgba(255, 217, 208, 0.24);
        background: rgba(62, 10, 10, 0.9);
        color: #fff1ee;
        cursor: pointer;
        transition: background 140ms ease, transform 140ms ease;
      }
      .btn:hover {
        background: rgba(92, 16, 16, 0.95);
      }
      .btn-primary {
        background: #fff1ee;
        color: #240505;
        border-color: #fff1ee;
        font-weight: 700;
      }
      .btn-primary:hover {
        background: #ffd9d0;
      }
      .btn-accent {
        background: rgba(225, 29, 72, 0.24);
        border-color: rgba(251, 113, 133, 0.55);
      }
      .viewer {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 14px;
      }
      .poster-wrap {
        width: 100%;
        max-width: 1800px;
        border-radius: 14px;
        overflow: hidden;
        background: #fff;
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.65);
        border: 1px solid rgba(255, 217, 208, 0.22);
      }
      .poster-wrap img {
        display: block;
        width: 100%;
        height: auto;
      }
      .hint {
        margin-top: 10px;
        font-size: 12px;
        color: rgba(255, 217, 208, 0.72);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./">
        <img src="./favicon.svg?v=5" alt="" />
        <div>
          <div class="brand-title">CVA — MUSCULAR SYSTEM (ORIGINAL 5560×3563)</div>
          <div class="brand-sub">Pinch to zoom · Save as lossless PNG or print-ready PDF</div>
        </div>
      </a>
      <div class="actions">
        <a
          class="btn btn-primary"
          href="./assets/CVA-Muscular-System-Original.png"
          download="CVA-Muscular-System-Original.png"
        >
          ⬇ Save PNG (Original 5560×3563)
        </a>
        <a
          class="btn btn-accent"
          href="./assets/CVA-Muscular-System-Original.pdf"
          download="CVA-Muscular-System-Original.pdf"
        >
          ⬇ Save PDF (Print-Ready)
        </a>
        <a
          class="btn"
          href="./assets/CVA-Muscular-System-Original.png"
          target="_blank"
          rel="noreferrer"
        >
          ↗ Raw Image Only
        </a>
        <a class="btn" href="./">
          ← Interactive 3D &amp; Map
        </a>
      </div>
    </header>

    <main class="viewer">
      <div class="poster-wrap">
        <img
          src="./assets/CVA-Muscular-System-Original.png"
          alt="CVA Muscular System Original Full-Resolution Poster (5560x3563)"
        />
      </div>
      <p class="hint">
        Original uncompressed 5560 × 3563 px master poster · Group 2 (Abangan, Ceniza, Saromines, Villarosa)
      </p>
    </main>
  </body>
</html>
